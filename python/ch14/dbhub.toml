# Chapitre 14 : DBHub branché sur la copie d'exploration des commandes d'Awa, en lecture seule.
# Documentation : https://dbhub.ai/config/toml (lue le 21 octobre 2026, DBHub 1.5.0).
# Le chemin doit être absolu (un chemin relatif n'est pas trouvé sous Windows). CLAUDE_PROJECT_DIR est
# la racine du projet : Claude Code la donne aux serveurs qu'il lance, et ch14/serveurs.py aussi.

[[sources]]
id = "commandes"
dsn = "sqlite:///${CLAUDE_PROJECT_DIR}/donnees_clients/commandes_exploration.sqlite3"

# readonly : DBHub refuse tout ce qui n'est pas une lecture (SELECT, PRAGMA, EXPLAIN…), puis exécute
# la requête avec PRAGMA query_only = ON, pour que SQLite refuse lui aussi une écriture.
# max_rows : une requête maladroite ne renvoie pas 10 000 lignes dans le contexte de Claude.
[[tools]]
name = "execute_sql"
source = "commandes"
readonly = true
max_rows = 200

# search_objects : la carte de la base (tables, colonnes, index), pour que Claude la découvre
# sans tout lire. Déclarer [[tools]] remplace la liste par défaut : chaque outil voulu est nommé ici.
[[tools]]
name = "search_objects"
source = "commandes"
