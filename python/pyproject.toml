[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comptoir"
version = "0.8.0"
description = "Le Comptoir d'Awa : code d'accompagnement du Tome 2 de « Maîtriser Claude » (Botlyx Academy)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.1,<3",     # API 2026-10-21 (chapitre 21) ; la 1.x envoyait 2023-06-01
    "fastapi>=0.150,<1",     # le Comptoir sur le web (chapitre 6)
    "uvicorn>=0.54,<1",
    "pillow>=11",            # réduire les photos, fabriquer les exemples (chapitre 7)
    "httpx2>=2.15,<3",       # l'API de Meta pour WhatsApp (chapitre 19) ; venait jusqu'ici par le SDK
]

[project.optional-dependencies]
tests = ["pytest>=8", "httpx>=0.28"]  # httpx : le client de test de FastAPI
agents = ["claude-agent-sdk>=0.2.168,<0.3"]  # le même agent avec le Claude Agent SDK (chapitre 13)
mcp = ["anthropic[mcp]>=2.1,<3"]  # client MCP et conversion des outils pour le Tool Runner (chapitre 14)

[tool.setuptools]
packages = ["comptoir"]

[tool.setuptools.package-data]
comptoir = ["donnees/*.json", "donnees/atelier/*", "prompts/*.md", "pages/*.html", "connaissances/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
